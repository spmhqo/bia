<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Cover (for reply report)</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sub-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
    }

    .input-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 35px;
    }

    .nav-btn {
      background: var(--card-bg);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: all 0.2s;
      backdrop-filter: blur(12px);
    }

    .nav-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    #promptsContainer {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      min-height: 110px;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .sub-header { font-size: 1rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>3D Cover</h1>
      <p class="sub-header">(for reply report)</p>
    </header>

    <nav class="input-nav" aria-label="Input Field Navigation">
      <a href="#card-finalReportTitle" class="nav-btn">FINAL REPORT TITLE</a>
      <a href="#card-finalReportSubTitle" class="nav-btn">FINAL REPORT SUB-TITLE</a>
      <a href="#card-posterName" class="nav-btn">Poster Name</a>
    </nav>

    <div class="prompt-workflow">
      
      <!-- Multiline Input Card 1 -->
      <div class="step-card" id="card-finalReportTitle">
        <div class="step-header">
          <span class="step-label">FINAL REPORT TITLE</span>
          <button class="clear-btn" onclick="resetInput('inputFinalReportTitle')">Reset</button>
        </div>
        <label for="inputFinalReportTitle">[FINAL REPORT TITLE]</label>
        <textarea id="inputFinalReportTitle" class="dynamic-input" placeholder="Type or paste the FINAL REPORT TITLE here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Multiline Input Card 2 -->
      <div class="step-card" id="card-finalReportSubTitle">
        <div class="step-header">
          <span class="step-label">FINAL REPORT SUB-TITLE</span>
          <button class="clear-btn" onclick="resetInput('inputFinalReportSubTitle')">Reset</button>
        </div>
        <label for="inputFinalReportSubTitle">[FINAL REPORT SUB-TITLE]</label>
        <textarea id="inputFinalReportSubTitle" class="dynamic-input" placeholder="Type or paste the FINAL REPORT SUB-TITLE here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Multiline Input Card 3 -->
      <div class="step-card" id="card-posterName">
        <div class="step-header">
          <span class="step-label">Poster Name</span>
          <button class="clear-btn" onclick="resetInput('inputPosterName')">Reset</button>
        </div>
        <label for="inputPosterName">[Poster Name]</label>
        <textarea id="inputPosterName" class="dynamic-input" placeholder="Type or paste the Poster Name here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt Result Cards -->
      <div id="promptsContainer">
        <!-- Prompts injected by JavaScript -->
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        text: `Based on the finished report created in this chat, create the actual final 3D report ecover image now. Use the exact final report title already established in this chat and the completed report content.

This standalone 3D report ecover will be the official product visual for this report and must be the exact image reused in later assets created in this same chat, especially the sales page bonus graphic.

Final report title: [FINAL REPORT TITLE]
Final report sub-title: [FINAL REPORT SUB-TITLE]
Brand name: For [Poster Name]. Use this name naturally where appropriate and preserve the spelling exactly.
Use this Color Palette: Couleurs aléatoires 185 Color Palette

Colors in Palette	
Hex	RGB
#26483c	(38,72,60)
#fa72dc	(250,114,220)
#3582be	(53,130,190)
#d2da7e	(210,218,126)
#5d8d7f	(93,141,127)

Create the actual best-and-final image now with your image generation capabilities. Do not return an image prompt, design brief, plan, code, instructions, or written description. Render one polished final image only.

VISUAL QUALITY STANDARD:
- Make the finished image feel premium, dramatic, professionally art-directed, and immediately attention-grabbing without becoming cluttered or gimmicky
- Use a strong visual hierarchy so the main hook, report title, product visual, and supporting details are understood in seconds
- Use bold composition, confident typography, purposeful contrast, dimensional lighting, depth, texture, and topic-relevant visual storytelling where appropriate
- Make every design choice feel intentional, cohesive, and sales-page ready rather than like a generic template
- Keep the image visually rich while preserving clean spacing, legibility, balance, and a clear focal point
- Avoid weak stock-layout styling, random decorative elements, tiny text, excessive copy, flat presentation, muddy contrast, awkward empty areas, and visual noise
- Adapt the visual direction to the actual niche and product promise. Do not force the same style, icons, imagery, or layout onto every topic

ACCURACY AND TRUST RULES:
- Preserve the exact report title and author or brand spelling from this chat
- Check all visible text for spelling, readability, spacing, cropping, and accuracy before finalizing
- Keep important text and visuals inside safe margins
- Do not invent testimonials, prices, statistics, guarantees, badges, awards, endorsements, or claims that were not established in this conversation
- Do not add filler text, placeholder text, duplicated words, nonsense lettering, accidental logos, or unrelated visual elements

SECRET CAMPAIGN STANDARD:
- Keep every launch asset centered on one valuable information gap, the overlooked discoveries that close it, the familiar desired result, and the practical advantage gained from knowing them
- Sell access to overlooked methods, quiet advantages, hidden features, unspoken rules, lesser-known clues, underused opportunities, or experienced-person distinctions
- Preserve a strong curiosity gap. Reveal enough to make the discovery credible and desirable, but do not give away the complete secret list or full answer in the promotional asset
- Use credible language such as overlooked, underused, rarely explained, hidden in plain sight, not usually emphasized, or noticed through experience
- Never claim nobody else knows it, experts are hiding it, the industry is suppressing it, or the information has never been revealed
- Make the buyer think, “What do other people know that I don't?” and “I need to see what I'm missing”
- Keep the exact information gap, desired result, intended buyer, overlooked advantage, insider mechanism, and scope boundary established earlier in this chat
- Make every asset reinforce the same implicit buyer question created by the title: “What am I missing that could give me an advantage?”
- Make the report feel like a distinct, collectible information product with a compact set of discoveries worth owning, saving, and revisiting
- Preserve the curiosity gap without misrepresenting what the report contains, and make every hook point toward the exact payoff delivered inside
- Do not broaden the report into a course, promise a guaranteed result, fabricate exclusivity, or introduce a different core topic.

Design direction:
- Create a jaw-dropping premium digital PDF report cover mockup that looks professionally designed, highly desirable, and strong enough to anchor an entire sales page
- Build one bold visual concept around the report's exact problem, promised advantage, and niche rather than using generic topic icons or predictable stock imagery
- Make the exact report title the dominant focal point with confident, highly readable typography and strong hierarchy
- Add a concise subtitle only when it clearly strengthens the promise and remains readable at thumbnail size
- Use sophisticated color relationships, purposeful contrast, crisp composition, dimensional lighting, realistic depth, and polished details that make the report feel valuable and collectible
- Make the 3D perspective believable and premium. Use clean edges, realistic thickness, controlled shadows, and professional mockup proportions
- Avoid weak clip art, generic template styling, crowded text, decorative filler, multiple competing focal points, or visuals that don't directly support the product promise
- Use a solid pure white #FFFFFF background across the entire image canvas
- Keep the background completely white and clean. Do not use transparency, gradients, colored backdrops, room scenes, dark backgrounds, environmental scenes, desks, shelves, hands, or lifestyle settings
- Use only a subtle natural product shadow on the white canvas when it improves realism

Before finalizing, verify that the title is exact, the front cover remains readable at thumbnail size, the 3D mockup looks realistic, and the product feels distinctive enough to serve as the official visual for every later asset.

Final output: render one jaw-dropping, production-ready standalone 3D report ecover image on a solid pure #FFFFFF white background. This is the official product visual to carry forward in this same chat. Keep the full product comfortably inside the canvas with generous white space around it, and include no accidental extra text or duplicate objects.`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const titleVal = document.getElementById('inputFinalReportTitle').value.trim() || "[FINAL REPORT TITLE]";
      const subTitleVal = document.getElementById('inputFinalReportSubTitle').value.trim() || "[FINAL REPORT SUB-TITLE]";
      const posterVal = document.getElementById('inputPosterName').value.trim() || "[Poster Name]";

      templates.forEach(t => {
        let updatedText = t.text;
        updatedText = updatedText.split('[FINAL REPORT TITLE]').join(titleVal);
        updatedText = updatedText.split('[FINAL REPORT SUB-TITLE]').join(subTitleVal);
        updatedText = updatedText.split('[Poster Name]').join(posterVal);
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
</body>
</html>
