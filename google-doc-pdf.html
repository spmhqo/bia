<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turn AI Answer into PDF format</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    #promptsContainer {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.85rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Turn AI Answer into PDF format</h1>
    </header>

    <div class="prompt-workflow">
      <!-- Prompt Result Cards -->
      <div id="promptsContainer">
        <!-- Prompts injected by JavaScript -->
      </div>
    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 'complete-pdf',
        name: 'Complete PDF',
        text: `Now turn your previous answer into a practical guide suitable for PDF format.

I don't want a ready-to-use PDF or any downloadable PDF file. I want to copy and paste your response into Google Docs and create the PDF myself.

Please format and structure the content appropriately for Google Docs, using a clear heading hierarchy, well-organised sections, readable paragraphs, bullet points or numbered lists wherever appropriate, and consistent spacing. Ensure that the formatting is easy to copy and paste into Google Docs and that I can easily convert the document into a professionally formatted PDF.`
      },
      {
        id: 'part-of-pdf',
        name: 'Part of PDF',
        text: `Now convert your previous answer into a professionally structured section of a larger PDF document.

IMPORTANT CONTEXT

The previous answer is only ONE PART of the proposed PDF. It is NOT the complete content of the PDF.
Do not treat it as a standalone guide, complete report, or independent PDF document. Treat it as one section of a larger publication.

YOUR TASK

Prepare the previous answer as a well-organised, professionally written section that can be incorporated into the larger PDF.

FORMATTING AND EDITORIAL REQUIREMENTS

1. Preserve the original meaning, key information, explanations, and practical value of the previous answer.
2. Organise the content using an appropriate section heading, subheadings, and smaller subsections wherever necessary.
3. Maintain a logical flow so that this section fits naturally within a larger document.
4. Maintain consistency with the editorial style, writing tone, formatting conventions, and terminology used in the other sections of this PDF.
5. Do not add an artificial introduction, conclusion, executive summary, or standalone cover-page content unless genuinely necessary.
6. Avoid repeating general introductory or concluding information that would normally belong to the complete PDF.
7. Do not add unnecessary content, unrelated explanations, or promotional language.
8. Use readable paragraphs, bullet points, numbered lists, and examples wherever appropriate.
9. Maintain consistent formatting, heading hierarchy, paragraph structure, and spacing throughout.
10. Do not invent section numbers or assume the position of this section within the complete PDF. Use placeholders only if necessary.

OUTPUT REQUIREMENTS

I do NOT want a ready-to-use PDF or any downloadable PDF file.
Provide the complete formatted section directly in your response so that I can copy and paste it into Google Docs.
Ensure the formatting is clean, consistent, and suitable for inclusion in a professionally formatted PDF.

IMPORTANT FINAL INSTRUCTION

Your output must contain ONLY the formatted content of this particular section, not the entire proposed PDF.
Do not include explanations about your formatting decisions, editorial notes, or any commentary outside the section itself.`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">${t.name}</span>
          </div>
          <div class="prompt-content" id="p-${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p-${t.id}', this)">
            <span>Copy ${t.name}</span>
          </button>
        `;
        container.appendChild(card);
        document.getElementById(`p-${t.id}`).innerText = t.text;
      });
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
    };
  </script>
</body>
</html>
